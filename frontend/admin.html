<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Comedor Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        /* Estilos específicos para el menú lateral */
        /* Estilos específicos para el menú lateral */
        .sidebar {
            height: 100vh;
            background-color: #003366; /* Forzamos el color azul institucional aquí directamente */
            color: white;
            padding-top: 20px;
        }
        .sidebar a {
            color: white !important; /* Obligamos a que el texto siempre sea blanco */
            text-decoration: none;
            display: block;
            padding: 10px 20px;
            margin-bottom: 5px;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #002244;
            border-left: 4px solid #fff;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Menú Lateral -->
        <div class="col-md-3 col-lg-2 sidebar">
            <div class="text-center mb-4">
                <img src="./assets/logo.jpeg" alt="Logo" style="max-width: 130px; height: auto;" class="mb-2"">
                <h6 class="mt-2" id="nombreUsuarioDisplay">Bienvenido, Admin</h6>
            </div>
            <hr>
            <!-- Lista de los 9 Módulos -->
            <a href="#" class="active" id="menu-reporte-dia">Reporte del Día</a>
            <a href="#" id="menu-estudiantes">Gestión Estudiantes</a>
            <a href="#" id="menu-usuarios">Gestión Usuarios</a>
            <a href="#" id="menu-grados">Gestión Grados y Cursos</a>
            <a href="#" id="menu-derechos">Gestión Tipo Derecho</a>
            <a href="#" id="menu-reportes">Reportes</a>
            <a href="#" id="menu-limpieza">Limpieza de Datos</a>
            <a href="#" id="menu-backup">Copias de Seguridad</a>
            <a href="#" id="menu-qr">Lector QR (Manual)</a>
            <hr>
            <a href="#" id="btn-cerrar-sesion" class="text-danger fw-bold">Cerrar Sesión</a>
            <a href="#" id="menu-creditos" class="list-group-item list-group-item-action bg-transparent text-white">ℹ️ Créditos</a>
            
        </div>

        <!-- Área de Contenido Principal -->
        <div class="col-md-9 col-lg-10 contenido-principal">
            <h2 id="titulo-modulo" style="color: var(--color-principal);">Reporte del Día</h2>
            <hr>
            
            <!-- Aquí inyectaremos dinámicamente el contenido de cada módulo con JavaScript -->
            <div id="contenedor-modulo" class="card shadow-sm p-4">
                <p>Cargando información del día...</p>
                <!-- Aquí irá la tabla de estudiantes que reclamaron desayuno hoy -->
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="./js/admin.js"></script>


</body>
</html>
